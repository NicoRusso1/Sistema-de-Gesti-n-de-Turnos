services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gestion_turnos_hospital
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "80"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:55KSt3vDezolpcIzltRbbMIT2BEY7YbUmFC8qD3RrAA=}
      APP_URL: http://localhost:8000
      APP_TIMEZONE: America/Argentina/Buenos_Aires
      FRONTEND_URL: http://localhost:4200
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: gestion_turnos_hospital
      DB_USERNAME: root
      DB_PASSWORD: secret
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
      RUN_DEMO_SEEDER: "true"
    ports:
      - "8000:80"
    volumes:
      - backend_storage:/var/www/html/storage/app

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      PORT: "80"
      API_URL: http://localhost:8000/api
    ports:
      - "4200:80"

volumes:
  mysql_data:
  backend_storage:
