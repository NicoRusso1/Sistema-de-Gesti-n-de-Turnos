<div class="admin">
  <header class="page-header">
    <div>
      <h1>Historial de auditoría</h1>
    </div>
  </header>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Acción</th>
          <th class="col-secundaria">Ejecutó</th>
          <th>Afectado</th>
        </tr>
      </thead>
      <tbody>
        @for (e of entries(); track e.id) {
          <tr>
            <td data-label="Fecha">{{ e.date | date:'dd/MM/yyyy HH:mm' }}</td>
            <td data-label="Acción">
              <span class="badge" [class]="badgeClass(e.action.name)">{{ e.action.label }}</span>
            </td>
            <td data-label="Ejecutó" class="col-secundaria">{{ e.actor.name }}</td>
            <td data-label="Afectado" class="cell-main">{{ e.affected.name }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
